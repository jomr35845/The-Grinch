let player;
let currentIndex = 0;
let started = false;

// Crear reproductor
function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    height: '100%',
    width: '100%',
    videoId: VIDEOS[0],
    playerVars: {
      autoplay: 0,
      controls: 1
    },
    events: {
      'onStateChange': onPlayerStateChange
    }
  });
}

// Cuando un video termina
function onPlayerStateChange(event) {
  if (event.data === YT.PlayerState.ENDED) {
    currentIndex++;
    if (currentIndex < VIDEOS.length) {
      player.loadVideoById(VIDEOS[currentIndex]);
      actualizarContador();
    } else {
      alert("🎉 Lista terminada");
      currentIndex = 0;
      actualizarContador();
    }
  }
}

// Botón reproducir
document.getElementById("playBtn").addEventListener("click", () => {
  if (!started) {
    player.playVideo();
    started = true;
    actualizarContador();
  }
});

// Actualiza contador visual
function actualizarContador(){
  document.getElementById("info").innerText =
    "Video: " + (currentIndex + 1) + " / " + VIDEOS.length;
}
